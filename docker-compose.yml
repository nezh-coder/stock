services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - stock_network

  nginx:
    image: nginx:alpine
    container_name: stock_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - stock_network

  db:
    image: mariadb:10.4
    container_name: stock_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - stock_dbdata:/var/lib/mysql
    networks:
      - stock_network

networks:
  stock_network:

volumes:
  stock_dbdata: